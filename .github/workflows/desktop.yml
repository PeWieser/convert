# Baut den Windows-Installer der Desktop-App.
#
# Bewusst ohne FFmpeg im Artefakt: FFmpeg wird erst im Installer erkannt und, falls
# es fehlt, dort geladen (siehe docs/DESKTOP-PLAN.md, Abschnitt 4). Wer hier ein
# FFmpeg-Bundle einbaut, baut Ballast und ein Update-Problem.
#
# Auslöser: Tags `desktop-v*` (ergibt ein Release) oder manueller Lauf.

name: Desktop-Installer

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Quellcode
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten (Renderer)
        run: npm ci

      - name: Prüfen
        run: |
          npm run typecheck
          npm test

      - name: Renderer bauen
        run: npm run build

      - name: Abhängigkeiten (Desktop)
        working-directory: desktop
        run: npm ci

      - name: Desktop bauen
        working-directory: desktop
        run: npm run build

      - name: Installer packen (NSIS, ohne FFmpeg)
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never

      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: wandler-setup-windows
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: An Release hängen
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME#refs/tags/}" desktop/release/*.exe --clobber
