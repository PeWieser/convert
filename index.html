<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link

      type="image/svg+xml"

    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Wandler – Medien konvertieren</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("wandler.settings.v1") || "{}");
        var a = s.appearance || "auto";
        var d = a === "dark" || (a === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
